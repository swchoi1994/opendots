allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.258'
  - '@anthropic-ai/claude-agent-sdk@0.3.258'
# pnpm 10+ reads build-script approvals and other settings from this file
# (they used to live under the "pnpm" key in package.json).
#
# These three packages ship prebuilt native binaries via a postinstall script.
# Without approval pnpm skips those scripts and exits non-zero, which then makes
# every `pnpm <script>` fail its pre-run dependency check. Approving them lets
# install finish clean so `pnpm dev`, `pnpm db:init`, etc. run normally.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
