# OpenDots and a Postgres server with pgvector. Only the app is published, and
# only on 127.0.0.1: without sign-in, whoever reaches it controls every bot.
# Publish it further only with the Clerk keys set, operators listed and
# sign-ups restricted (README, "Sign-in and workspaces"), and list the public
# host name in OPENDOTS_ALLOWED_HOSTS.
# Postgres is reachable from the app alone (and never collides with a Postgres
# already running on the host).
#
#   docker compose up --build
#   docker compose logs -f app
#   docker compose down -v        (-v also drops the data volumes)

services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATA_STORE: postgres
      # Service names are DNS inside the compose network.
      DATABASE_URL: postgres://opendots:opendots@postgres:5432/opendots
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Ollama on the host machine.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OPENDOTS_DEFAULT_MODEL: ${OPENDOTS_DEFAULT_MODEL:-}
      BOT_MAX_TURNS: ${BOT_MAX_TURNS:-12}
      OPENDOTS_DATA_DIR: /data
      # Empty means a random key per process; set one to keep share-link sessions across restarts.
      DEPLOYMENT_SESSION_SECRET: ${DEPLOYMENT_SESSION_SECRET:-}
      # Sign-in: both set turns it on, both empty keeps OpenDots local.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      OPENDOTS_OPERATORS: ${OPENDOTS_OPERATORS:-}
      OPENDOTS_ALLOWED_HOSTS: ${OPENDOTS_ALLOWED_HOSTS:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - opendots-data:/data
    depends_on:
      # service_healthy, not service_started: the app migrates on first use and
      # must not race the database.
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # pgvector ships the extension prebuilt; plain postgres:17 does not have it.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: opendots
      POSTGRES_PASSWORD: opendots
      POSTGRES_DB: opendots
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opendots -d opendots']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  opendots-data:
